<header class="topbar">
	<nav class="nav">
		<a routerLink="/photos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
			Photos
		</a>
		<a routerLink="/photos/new" routerLinkActive="active">
			New Photo
		</a>
	</nav>

	<div class="loading-bar" *ngIf="isLoading()">
		<div class="loading-fill"></div>
	</div>
</header>

<section class="global-error" *ngIf="errorMessage()">
	<p>{{ errorMessage() }}</p>
	<button type="button" (click)="clearGlobalError()">Dismiss</button>
</section>

<router-outlet />
