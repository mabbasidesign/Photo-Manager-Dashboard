<header class="topbar">
	<nav class="nav">
		<a
			*ngIf="isAuthenticated()"
			routerLink="/photos"
			routerLinkActive="active"
			[routerLinkActiveOptions]="{ exact: true }"
		>
			Photos
		</a>
		<a *ngIf="isAuthenticated()" routerLink="/photos/new" routerLinkActive="active">
			New Photo
		</a>
		<a *ngIf="!isAuthenticated()" routerLink="/login" routerLinkActive="active">Login</a>

		<button *ngIf="isAuthenticated()" type="button" class="logout-button" (click)="logout()">
			Logout
		</button>
	</nav>

	<div class="loading-bar" *ngIf="isLoading()">
		<div class="loading-fill"></div>
	</div>
</header>

<section class="global-error" *ngIf="errorMessage()">
	<p>{{ errorMessage() }}</p>
	<button type="button" (click)="clearGlobalError()">Dismiss</button>
</section>

<router-outlet />
